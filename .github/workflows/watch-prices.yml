name: Daily price watch

# Fetches cheapest fares once a day, commits them to data/history.json, and
# sends push/email alerts if the target price is hit.
# Free: GitHub Actions minutes are unlimited for public repos.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily (off the hour to avoid peak load)
  workflow_dispatch:
    # Manual/on-demand runs. The PWA's "Search this route" button triggers this
    # via the REST API with these inputs. Leave them empty (or run from the
    # Actions tab) for a normal daily-config run.
    inputs:
      origins:
        description: "On-demand origins — comma-separated IATA (e.g. LIS,AMS). Empty = daily watch-config."
        required: false
        default: ""
      destinations:
        description: "On-demand destinations — comma-separated IATA (e.g. NAT). Empty = daily watch-config."
        required: false
        default: ""
      months:
        description: "On-demand months — comma-separated YYYY-MM (e.g. 2027-02,2027-03). Empty = watch-config months."
        required: false
        default: ""

permissions:
  contents: write # needed to commit the updated history back to the repo

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install notifier dependencies
        run: npm install --no-audit --no-fund

      - name: Self-check (cheapest-day regression)
        run: node scripts/selfcheck.mjs

      - name: Fetch prices
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          # On-demand inputs (empty for the daily cron → watch-config is used).
          RAVEN_ORIGINS: ${{ github.event.inputs.origins }}
          RAVEN_DESTINATIONS: ${{ github.event.inputs.destinations }}
          RAVEN_MONTHS: ${{ github.event.inputs.months }}
        run: node scripts/fetch-prices.mjs

      - name: Send alerts (push + email)
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: node scripts/notify.mjs

      - name: Commit updated data
        run: |
          git config user.name "raven-bot"
          git config user.email "raven-bot@users.noreply.github.com"
          git add data/history.json data/alert-state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "chore(data): daily price snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
